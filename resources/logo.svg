<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8273FF"/>
      <stop offset="1" stop-color="#4F3FE0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8F"/>
      <stop offset="1" stop-color="#F0365A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b1060" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <g fill="#fff" filter="url(#soft)">
    <rect x="138" y="112" width="76" height="288" rx="38"/>
    <rect x="138" y="112" width="236" height="76" rx="38"/>
    <rect x="138" y="226" width="164" height="70" rx="35"/>
  </g>
  <circle cx="352" cy="352" r="58" fill="#fff" filter="url(#soft)"/>
  <circle cx="352" cy="352" r="42" fill="url(#dot)"/>
</svg>
